<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a12">
  <title>Fireworks · I Didn't Stop</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    #fireworks {
      position: fixed;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.95;
    }

    .night-sky {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 18% 72%, rgba(84, 31, 117, 0.18), transparent 38%),
        radial-gradient(ellipse at 82% 60%, rgba(28, 57, 123, 0.18), transparent 40%),
        linear-gradient(180deg, #090a12 0%, #11101c 58%, #1a1424 100%);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(180deg, #090a12 0%, #11101c 58%, #1a1424 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="night-sky" aria-hidden="true"></div>
  <canvas id="fireworks" aria-hidden="true"></canvas>
  <div id="spoken-message" class="sr-only" aria-live="polite"></div>

  <script>
    const spokenMessage = document.querySelector("#spoken-message");
    const canvas = document.querySelector("#fireworks");
    const context = canvas.getContext("2d");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let particles = [];
    let rockets = [];
    let stars = [];
    let lastLaunchTime = 0;
    let nextLaunchDelay = 700;
    let previousFrameTime = 0;
    let audioContext;
    let messageIndex = 0;
    let activeBurstMessage = null;
    let finaleStartedAt = null;
    let animationStopped = false;
    const messages = [
      "Your body may need rest, but your mind keeps pushing forward",
      "Every step you take leads you where you're going",
      "Even when you're tired, you keep going",
      "Even when you fall, you get back up",
      "You may have reached your limit",
      "Even when you're hurting, you keep going",
      "You've come this far, so don't give up",
      "Even when you feel weak, you keep fighting",
      "You've given it your all, and you've made it",
      "When you lose faith, don't let the pain defeat you",
      "Keep moving forward",
      "Even when you're tired, you keep going",
      "Even when you fall, you get back up"
    ];

    function resizeCanvas() {
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(window.innerWidth * pixelRatio);
      canvas.height = Math.round(window.innerHeight * pixelRatio);
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      stars = Array.from({ length: Math.floor((window.innerWidth * window.innerHeight) / 6500) }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: 0.35 + Math.random() * 1.1,
        phase: Math.random() * Math.PI * 2
      }));
    }

    function ensureAudio() {
      if (!audioContext) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioContext = new AudioContext();
      }
      if (audioContext && audioContext.state === "suspended") {
        audioContext.resume().catch((error) => {
          console.error("Could not start fireworks audio:", error);
        });
      }
    }

    function createNoiseBuffer(duration) {
      const buffer = audioContext.createBuffer(
        1,
        Math.floor(audioContext.sampleRate * duration),
        audioContext.sampleRate
      );
      const samples = buffer.getChannelData(0);
      for (let index = 0; index < samples.length; index += 1) {
        const fade = Math.pow(1 - index / samples.length, 2.8);
        samples[index] = (Math.random() * 2 - 1) * fade;
      }
      return buffer;
    }

    function playFireworkSound() {
      if (!audioContext) return;
      const now = audioContext.currentTime;
      const duration = 1.15;

      const noise = audioContext.createBufferSource();
      const crackleFilter = audioContext.createBiquadFilter();
      const crackleGain = audioContext.createGain();
      const echo = audioContext.createDelay(0.35);
      const echoGain = audioContext.createGain();
      noise.buffer = createNoiseBuffer(duration);
      crackleFilter.type = "highpass";
      crackleFilter.frequency.setValueAtTime(900, now);
      crackleFilter.frequency.exponentialRampToValueAtTime(320, now + duration);
      crackleGain.gain.setValueAtTime(0.0001, now);
      crackleGain.gain.exponentialRampToValueAtTime(0.11, now + 0.012);
      crackleGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      echo.delayTime.value = 0.16;
      echoGain.gain.value = 0.17;
      noise.connect(crackleFilter);
      crackleFilter.connect(crackleGain);
      crackleGain.connect(audioContext.destination);
      crackleGain.connect(echo);
      echo.connect(echoGain);
      echoGain.connect(audioContext.destination);
      noise.start(now);
      noise.stop(now + duration);

      const boom = audioContext.createOscillator();
      const boomGain = audioContext.createGain();
      boom.type = "sine";
      boom.frequency.setValueAtTime(85 + Math.random() * 25, now);
      boom.frequency.exponentialRampToValueAtTime(35, now + 0.72);
      boomGain.gain.setValueAtTime(0.0001, now);
      boomGain.gain.exponentialRampToValueAtTime(0.22, now + 0.012);
      boomGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.75);
      boom.connect(boomGain);
      boomGain.connect(audioContext.destination);
      boom.start(now);
      boom.stop(now + 0.75);

      const snap = audioContext.createBufferSource();
      const snapFilter = audioContext.createBiquadFilter();
      const snapGain = audioContext.createGain();
      snap.buffer = createNoiseBuffer(0.16);
      snapFilter.type = "bandpass";
      snapFilter.frequency.value = 2100 + Math.random() * 1300;
      snapFilter.Q.value = 0.7;
      snapGain.gain.setValueAtTime(0.19, now);
      snapGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
      snap.connect(snapFilter);
      snapFilter.connect(snapGain);
      snapGain.connect(audioContext.destination);
      snap.start(now);
      snap.stop(now + 0.16);
    }

    function launchRocket(speedMultiplier = 1) {
      const x = Math.random() * window.innerWidth;
      const y = window.innerHeight + 8;
      const targetY = window.innerHeight * (0.18 + Math.random() * 0.42);
      const speed = (430 + Math.random() * 250) * speedMultiplier;
      rockets.push({
        x,
        y,
        targetX: Math.max(20, Math.min(window.innerWidth - 20, x + (Math.random() - 0.5) * 220)),
        targetY,
        speed,
        hue: Math.random() * 360,
        age: 0,
        life: (y - targetY) / speed + 1,
        trail: []
      });
    }

    function explodeRocket(rocket) {
      const count = 100 + Math.floor(Math.random() * 80);
      const style = Math.random();
      const radiusSpeed = style < 0.2 ? 300 : 180 + Math.random() * 180;
      const burstHue = rocket.hue;
      if (!activeBurstMessage && messageIndex < messages.length) {
        const message = messages[messageIndex];
        messageIndex += 1;
        spokenMessage.textContent = message;
        activeBurstMessage = {
          text: message,
          x: rocket.x,
          y: rocket.y,
          hue: burstHue,
          age: 0,
          life: 2.8
        };
      }

      const flash = context.createRadialGradient(rocket.x, rocket.y, 0, rocket.x, rocket.y, 150);
      flash.addColorStop(0, `hsla(${burstHue}, 100%, 90%, 0.75)`);
      flash.addColorStop(0.12, `hsla(${burstHue}, 100%, 70%, 0.28)`);
      flash.addColorStop(1, `hsla(${burstHue}, 100%, 60%, 0)`);
      context.fillStyle = flash;
      context.fillRect(rocket.x - 150, rocket.y - 150, 300, 300);

      for (let index = 0; index < count; index += 1) {
        const angle = (Math.PI * 2 * index) / count + Math.random() * 0.2;
        const speed = style < 0.2
          ? radiusSpeed * (0.88 + Math.random() * 0.08)
          : radiusSpeed * (0.28 + Math.random() * 0.72);
        const hue = (burstHue + (Math.random() - 0.5) * 34 + 360) % 360;
        particles.push({
          x: rocket.x,
          y: rocket.y,
          lastX: rocket.x,
          lastY: rocket.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: style > 0.8 ? 2.4 + Math.random() * 1.2 : 1.1 + Math.random() * 1.1,
          age: 0,
          size: 0.8 + Math.random() * 1.7,
          hue,
          gravity: style > 0.8 ? 105 : 45 + Math.random() * 45,
          drag: 0.965 + Math.random() * 0.025,
          twinkle: Math.random() > 0.78
        });
      }
      playFireworkSound();

      if (style > 0.65) {
        window.setTimeout(() => {
          if (animationStopped) return;
          for (let index = 0; index < 3; index += 1) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 75 + Math.random() * 110;
            particles.push({
              x: rocket.x + Math.cos(angle) * (25 + Math.random() * 40),
              y: rocket.y + Math.sin(angle) * (25 + Math.random() * 40),
              lastX: rocket.x,
              lastY: rocket.y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              life: 0.6 + Math.random() * 0.4,
              age: 0,
              size: 1.3,
              hue: (burstHue + Math.random() * 50) % 360,
              gravity: 65,
              drag: 0.97,
              twinkle: true
            });
          }
        }, 220);
      }
    }

    function wrapMessage(text, maxWidth) {
      const words = text.split(/\s+/);
      const lines = [];
      let line = "";

      for (const word of words) {
        const candidate = line ? `${line} ${word}` : word;
        if (line && context.measureText(candidate).width > maxWidth) {
          lines.push(line);
          line = word;
        } else {
          line = candidate;
        }
      }

      if (line) lines.push(line);
      return lines;
    }

    function animateFireworks(timestamp) {
      if (finaleStartedAt !== null && timestamp - finaleStartedAt >= 5000) {
        animationStopped = true;
        rockets = [];
        particles = [];
        context.clearRect(0, 0, window.innerWidth, window.innerHeight);
        return;
      }

      const delta = previousFrameTime ? Math.min((timestamp - previousFrameTime) / 1000, 0.035) : 0.016;
      previousFrameTime = timestamp;
      context.fillStyle = "rgba(8, 9, 16, 0.2)";
      context.fillRect(0, 0, window.innerWidth, window.innerHeight);

      for (const star of stars) {
        const opacity = 0.28 + (Math.sin(timestamp / 900 + star.phase) + 1) * 0.2;
        context.beginPath();
        context.fillStyle = `rgba(255, 255, 255, ${opacity})`;
        context.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        context.fill();
      }

      const finaleActive = finaleStartedAt !== null;
      if (timestamp - lastLaunchTime > nextLaunchDelay) {
        launchRocket(finaleActive ? 2.2 : 1);
        if (finaleActive && Math.random() > 0.35) {
          launchRocket(2.2);
        }
        lastLaunchTime = timestamp;
        nextLaunchDelay = finaleActive
          ? 110 + Math.random() * 70
          : 420 + Math.random() * 700;
        if (!finaleActive && Math.random() > 0.58) {
          window.setTimeout(() => {
            if (!document.hidden && !animationStopped && finaleStartedAt === null) launchRocket();
          }, 160 + Math.random() * 300);
        }
      }

      rockets = rockets.filter((rocket) => {
        rocket.age += delta;
        rocket.x += (rocket.targetX - rocket.x) * Math.min(delta * 2.8, 1);
        rocket.y -= rocket.speed * delta;
        rocket.trail.push({ x: rocket.x, y: rocket.y, age: 0 });
        if (rocket.trail.length > 14) rocket.trail.shift();

        if (rocket.y <= rocket.targetY) {
          explodeRocket(rocket);
          return false;
        }

        for (let index = 0; index < rocket.trail.length; index += 1) {
          const point = rocket.trail[index];
          const opacity = (index + 1) / rocket.trail.length;
          context.beginPath();
          context.fillStyle = `hsla(${rocket.hue}, 100%, ${68 + opacity * 25}%, ${opacity})`;
          context.shadowBlur = 12 * opacity;
          context.shadowColor = `hsl(${rocket.hue}, 100%, 70%)`;
          context.arc(point.x, point.y, 1.2 + opacity * 1.8, 0, Math.PI * 2);
          context.fill();
        }

        context.beginPath();
        context.fillStyle = "#fff";
        context.shadowBlur = 18;
        context.shadowColor = `hsl(${rocket.hue}, 100%, 72%)`;
        context.arc(rocket.x, rocket.y, 2.4, 0, Math.PI * 2);
        context.fill();
        context.shadowBlur = 0;
        context.beginPath();
        context.strokeStyle = `hsla(${rocket.hue}, 100%, 78%, 0.92)`;
        context.lineWidth = 1.5;
        context.moveTo(rocket.x, rocket.y);
        const lastTrail = rocket.trail[0] || { x: rocket.x, y: rocket.y };
        context.lineTo(lastTrail.x, lastTrail.y);
        context.stroke();
        return rocket.age < rocket.life;
      });
      particles = particles.filter((particle) => {
        particle.age += delta;
        particle.lastX = particle.x;
        particle.lastY = particle.y;
        particle.x += particle.vx * delta;
        particle.y += particle.vy * delta;
        particle.vy += particle.gravity * delta;
        particle.vx *= Math.pow(particle.drag, delta * 60);
        particle.vy *= Math.pow(particle.drag, delta * 60);

        const opacity = 1 - particle.age / particle.life;
        if (opacity <= 0) return false;
        const flicker = particle.twinkle && Math.random() > 0.86 ? 0.22 : 1;
        const visibleOpacity = opacity * flicker;
        context.beginPath();
        context.strokeStyle = `hsla(${particle.hue}, 100%, 72%, ${visibleOpacity * 0.78})`;
        context.lineWidth = Math.max(0.7, particle.size * 0.8);
        context.moveTo(particle.lastX, particle.lastY);
        context.lineTo(particle.x, particle.y);
        context.stroke();
        context.beginPath();
        context.fillStyle = `hsla(${particle.hue}, 100%, ${particle.twinkle ? 82 : 68}%, ${visibleOpacity})`;
        context.shadowBlur = 10 * opacity;
        context.shadowColor = `hsl(${particle.hue}, 100%, 70%)`;
        context.arc(particle.x, particle.y, Math.max(0.2, particle.size * opacity), 0, Math.PI * 2);
        context.fill();
        context.shadowBlur = 0;
        return particle.age < particle.life;
      });

      if (activeBurstMessage) {
        const burst = activeBurstMessage;
        burst.age += delta;
        const progress = burst.age / burst.life;
        if (progress >= 1) {
          activeBurstMessage = null;
          if (messageIndex === messages.length) {
            finaleStartedAt = timestamp;
          }
        } else {
          const fadeIn = Math.min(progress * 7, 1);
          const fadeOut = Math.min((1 - progress) * 3.5, 1);
          const opacity = Math.max(0, Math.min(fadeIn, fadeOut));
          const maxWidth = Math.max(120, Math.min(window.innerWidth - 40, 660));
          const rise = Math.sin(Math.min(progress * 1.5, 1) * Math.PI / 2) * 12;

          const fontSize = Math.min(25, Math.max(16, window.innerWidth * 0.042));
          const lineHeight = fontSize * 1.35;
          context.font = `800 ${fontSize}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
          context.textAlign = "center";
          context.textBaseline = "middle";
          const lines = wrapMessage(burst.text, maxWidth);
          const textHeight = lines.length * lineHeight;
          const safeTop = 24 + textHeight / 2;
          const safeBottom = window.innerHeight - 24 - textHeight / 2;
          const widestLine = Math.max(...lines.map((line) => context.measureText(line).width));
          const safeLeft = Math.min(window.innerWidth - 16, 16 + widestLine / 2);
          const safeRight = Math.max(16, window.innerWidth - 16 - widestLine / 2);
          const textX = Math.max(safeLeft, Math.min(safeRight, burst.x));
          const textCenterY = Math.max(safeTop, Math.min(safeBottom, burst.y - rise));

          lines.forEach((line, index) => {
            const y = textCenterY + (index - (lines.length - 1) / 2) * lineHeight;
            context.lineJoin = "round";
            context.lineWidth = Math.max(4, fontSize * 0.3);
            context.strokeStyle = `rgba(7, 8, 15, ${opacity * 0.86})`;
            context.strokeText(line, textX, y, maxWidth);
            context.fillStyle = `hsla(${burst.hue}, 100%, 88%, ${opacity})`;
            context.shadowBlur = 20;
            context.shadowColor = `hsla(${burst.hue}, 100%, 70%, ${opacity})`;
            context.fillText(line, textX, y, maxWidth);
            context.shadowBlur = 0;
          });
        }
      }

      window.requestAnimationFrame(animateFireworks);
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    document.addEventListener("pointerdown", ensureAudio);
    document.addEventListener("keydown", ensureAudio);
    ensureAudio();

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && audioContext) {
        audioContext.suspend();
      } else {
        ensureAudio();
      }
    });

    if (!reduceMotion) {
      lastLaunchTime = performance.now() - nextLaunchDelay;
      window.requestAnimationFrame(animateFireworks);
    }
  </script>
</body>
</html>
